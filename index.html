<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت وظایف روزانه</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'Tahoma', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-brand-500 selection:text-white pb-12">

    <!-- App Header -->
    <header class="bg-gradient-to-r from-brand-700 via-brand-600 to-brand-500 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-5 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="p-2.5 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">برنامه‌ریزی و مدیریت وظایف</h1>
                    <p class="text-xs text-brand-100 font-light mt-0.5" id="current-jalali-month">تقویم هجری شمسی</p>
                </div>
            </div>
            
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-100 border border-emerald-400/30">
                <span class="w-2 h-2 ml-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                فعال و آماده‌کار
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
        
        <!-- Day Tabs (7 Days) -->
        <nav class="flex space-x-2 space-x-reverse overflow-x-auto pb-3 pt-1 no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0" id="tabs-container">
            <!-- Tabs injected via JavaScript -->
        </nav>

        <!-- Main Task Area -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 mt-3 transition-all duration-300">
            
            <!-- Date Display Header -->
            <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2" id="selected-day-title">
                        <span>--</span>
                        <span id="today-badge" class="hidden text-xs font-semibold px-2.5 py-0.5 rounded-full bg-brand-100 text-brand-700">امروز</span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1" id="selected-day-sub">--</p>
                </div>
                <span class="text-xs font-medium px-3 py-1 bg-slate-100 text-slate-600 rounded-lg" id="task-counter">
                    ۰ وظیفه
                </span>
            </div>

            <!-- Input Form -->
            <form id="add-task-form" class="mb-6">
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="عنوان وظیفه جدید را وارد کنید..." 
                        class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all text-sm"
                        required
                    >
                    <button 
                        type="submit" 
                        class="px-5 py-3 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white rounded-xl text-sm font-medium shadow-sm transition-all flex items-center gap-1.5 shrink-0"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>افزودن</span>
                    </button>
                </div>
            </form>

            <!-- Task List -->
            <div id="task-list" class="space-y-2.5 min-h-[180px]">
                <!-- Tasks injected dynamically -->
            </div>
        </div>
    </main>

    <script>
        // Jalali Date Converter Helper
        function toJalali(gy, gm, gd) {
            let g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            let jy = (gy <= 1600) ? 0 : 979;
            gy -= (gy <= 1600) ? 621 : 1600;
            let gy2 = (gm > 2) ? (gy + 1) : gy;
            let days = (365 * gy) + parseInt((gy2 + 3) / 4) - parseInt((gy2 + 99) / 100) + parseInt((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
            jy += 33 * parseInt(days / 12053);
            days %= 12053;
            jy += 4 * parseInt(days / 1461);
            days %= 1461;
            jy += parseInt((days - 1) / 365);
            if (days > 0) days = (days - 1) % 365;
            let jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
            let jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
            return [jy, jm, jd];
        }

        const PERSIAN_MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
        const WEEK_DAYS = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنج‌شنبه", "جمعه", "شنبه"];

        function toPersianDigits(num) {
            return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        let currentActiveDayIndex = 0;
        let daysData = [];

        function initDays() {
            daysData = [];
            const now = new Date();
            
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(now);
                dateObj.setDate(now.getDate() + i);
                
                const [jy, jm, jd] = toJalali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
                const dayName = WEEK_DAYS[dateObj.getDay()];
                const dateKey = `${jy}-${String(jm).padStart(2, '0')}-${String(jd).padStart(2, '0')}`;

                daysData.push({
                    index: i,
                    dayName: dayName,
                    dayNum: jd,
                    monthName: PERSIAN_MONTHS[jm - 1],
                    year: jy,
                    dateKey: dateKey,
                    isToday: i === 0
                });
            }
        }

        // LocalStorage Data Management
        function getSavedTasks() {
            const data = localStorage.getItem('farsi_tasks_app_data');
            return data ? JSON.parse(data) : {};
        }

        function saveTasksToStorage(allTasks) {
            localStorage.setItem('farsi_tasks_app_data', JSON.stringify(allTasks));
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';

            daysData.forEach((day, index) => {
                const isActive = index === currentActiveDayIndex;
                const tab = document.createElement('button');
                tab.onclick = () => switchTab(index);
                
                tab.className = `flex-1 min-w-[105px] p-3 rounded-2xl text-center transition-all duration-200 border flex flex-col items-center justify-center shrink-0 ${
                    isActive 
                    ? 'bg-brand-600 text-white border-brand-600 shadow-md shadow-brand-500/20 scale-[1.02]' 
                    : 'bg-white text-slate-600 border-slate-200/80 hover:border-slate-300 hover:bg-slate-100/50'
                }`;

                tab.innerHTML = `
                    <span class="text-xs font-medium ${isActive ? 'text-brand-100' : 'text-slate-400'}">${day.isToday ? 'امروز' : day.dayName}</span>
                    <span class="text-base font-bold my-0.5">${toPersianDigits(day.dayNum)} ${day.monthName}</span>
                    <span class="text-[10px] ${isActive ? 'text-brand-100' : 'text-slate-400'}">${day.dayName}</span>
                `;
                container.appendChild(tab);
            });
        }

        function switchTab(index) {
            currentActiveDayIndex = index;
            renderTabs();
            renderTasks();
        }

        function renderTasks() {
            const currentDay = daysData[currentActiveDayIndex];
            document.getElementById('selected-day-title').children[0].innerText = `${currentDay.dayName} ${toPersianDigits(currentDay.dayNum)} ${currentDay.monthName}`;
            
            const todayBadge = document.getElementById('today-badge');
            if (currentDay.isToday) {
                todayBadge.classList.remove('hidden');
            } else {
                todayBadge.classList.add('hidden');
            }

            document.getElementById('selected-day-sub').innerText = `برنامه‌ریزی روز ${currentDay.dayName}`;

            const allTasks = getSavedTasks();
            const dayTasks = allTasks[currentDay.dateKey] || [];
            
            document.getElementById('task-counter').innerText = `${toPersianDigits(dayTasks.length)} وظیفه`;

            const listContainer = document.getElementById('task-list');
            listContainer.innerHTML = '';

            if (dayTasks.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-slate-300">
                        <svg class="w-12 h-12 mb-2 stroke-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p class="text-sm font-light text-slate-400">هیچ وظیفه‌ای برای این روز ثبت نشده است</p>
                    </div>
                `;
                return;
            }

            dayTasks.forEach((task, tIndex) => {
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-3.5 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-white hover:border-slate-200 hover:shadow-sm transition-all duration-200 animate-fade-in ${task.completed ? 'opacity-60 bg-slate-50' : ''}`;
                
                item.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse min-w-0 flex-1 ml-2">
                        <button onclick="toggleTask(${tIndex})" class="w-5 h-5 rounded-md border ${task.completed ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300 hover:border-brand-500'} flex items-center justify-center transition-colors">
                            ${task.completed ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </button>
                        <span class="text-sm font-medium ${task.completed ? 'line-through text-slate-400' : 'text-slate-700'} truncate">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${tIndex})" class="text-slate-300 hover:text-red-500 p-1.5 rounded-lg hover:bg-red-50 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                `;
                listContainer.appendChild(item);
            });
        }

        // Action Handlers
        document.getElementById('add-task-form').onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (!text) return;

            const currentDay = daysData[currentActiveDayIndex];
            const allTasks = getSavedTasks();
            
            if (!allTasks[currentDay.dateKey]) {
                allTasks[currentDay.dateKey] = [];
            }

            allTasks[currentDay.dateKey].push({
                text: text,
                completed: false,
                createdAt: Date.now()
            });

            saveTasksToStorage(allTasks);
            input.value = '';
            renderTasks();
        };

        window.toggleTask = (index) => {
            const currentDay = daysData[currentActiveDayIndex];
            const allTasks = getSavedTasks();
            if (allTasks[currentDay.dateKey] && allTasks[currentDay.dateKey][index]) {
                allTasks[currentDay.dateKey][index].completed = !allTasks[currentDay.dateKey][index].completed;
                saveTasksToStorage(allTasks);
                renderTasks();
            }
        };

        window.deleteTask = (index) => {
            const currentDay = daysData[currentActiveDayIndex];
            const allTasks = getSavedTasks();
            if (allTasks[currentDay.dateKey]) {
                allTasks[currentDay.dateKey].splice(index, 1);
                saveTasksToStorage(allTasks);
                renderTasks();
            }
        };

        // Initialize App
        initDays();
        document.getElementById('current-jalali-month').innerText = `تقویم - سال ${toPersianDigits(daysData[0].year)}`;
        renderTabs();
        renderTasks();
    </script>
</body>
</html>
