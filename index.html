<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت وظایف روزانه - Cyberpunk Neon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'Tahoma', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            bg: '#0a0d14',
                            card: '#121824',
                            border: '#1e293b',
                            cyan: '#06b6d4',
                            pink: '#ec4899',
                            purple: '#a855f7',
                            glow: '#00f0ff'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background-color: #080b11;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1), transparent 40%);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .neon-border-cyan {
            border: 1px solid rgba(6, 182, 212, 0.4);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }
        .neon-border-cyan:focus-within {
            border-color: #06b6d4;
            box-shadow: 0 0 18px rgba(6, 182, 212, 0.4);
        }
        .neon-glow-pink {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-cyan-500 selection:text-black pb-12">

    <!-- Header Section -->
    <header class="bg-slate-900/80 backdrop-blur-xl border-b border-cyan-500/30 sticky top-0 z-50 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="p-2.5 bg-cyan-950/60 rounded-2xl border border-cyan-400/40 text-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500">
                        سیستم مدیریت وظایف 
                    </h1>
                    <p class="text-xs text-cyan-300/70 font-light mt-0.5" id="current-jalali-month">تقویم هجری شمسی</p>
                </div>
            </div>
            
            <!-- Live Sync Indicator -->
            <div id="sync-status" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-950/60 text-emerald-400 border border-emerald-500/40 shadow-[0_0_8px_rgba(16,185,129,0.2)]">
                <span class="w-2 h-2 ml-1.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_#10b981]"></span>
                <span id="sync-text">همگام‌سازی فعال</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 mt-6">
        
        <!-- 7 Days Tab Navigator -->
        <nav class="flex space-x-2 space-x-reverse overflow-x-auto pb-3 pt-1 no-scrollbar -mx-6 px-6 sm:mx-0 sm:px-0" id="tabs-container">
            <!-- Dynamic Tabs -->
        </nav>

        <!-- Task Content Box -->
        <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl border border-cyan-500/20 p-6 mt-3 shadow-[0_8px_32px_rgba(0,0,0,0.6)] transition-all duration-300">
            
            <!-- Active Tab Header -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
                <div>
                    <h2 class="text-lg font-bold text-white flex items-center gap-2" id="selected-day-title">
                        <span>--</span>
                        <span id="today-badge" class="hidden text-xs font-semibold px-2.5 py-0.5 rounded-full bg-fuchsia-950 text-fuchsia-300 border border-fuchsia-500/40 shadow-[0_0_8px_rgba(217,70,239,0.3)]">امروز</span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1" id="selected-day-sub">--</p>
                </div>
                <span class="text-xs font-mono font-medium px-3 py-1 bg-cyan-950/60 text-cyan-300 rounded-lg border border-cyan-500/30 shadow-[0_0_8px_rgba(6,182,212,0.2)]" id="task-counter">
                    ۰ وظیفه
                </span>
            </div>

            <!-- Task Input -->
            <form id="add-task-form" class="mb-6">
                <div class="flex gap-3">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="دستور یا وظیفه جدید را وارد کنید..." 
                        class="flex-1 px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm neon-border-cyan"
                        required
                    >
                    <button 
                        type="submit" 
                        class="px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-95 text-slate-950 font-black rounded-xl text-sm shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all flex items-center gap-1.5 shrink-0"
                    >
                        <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>افزودن</span>
                    </button>
                </div>
            </form>

            <!-- Task Items List -->
            <div id="task-list" class="space-y-3 min-h-[180px]">
                <!-- Tasks Rendered Dynamically -->
            </div>
        </div>
    </main>

    <script>
        // --- CONFIGURATION FOR CROSS-DEVICE SYNC ---
        const BIN_ID = "6aba0e31ffd5d1605336a27c";
        const MASTER_KEY = "$2a$10$ya4O7dI2NRAPIaZoKBF8Y.oDPbac6V5Ru7LSDitx5t5S2yL4WFDii";

        // --- JALALI CONVERTER ---
        function toJalali(gy, gm, gd) {
            let g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            let jy = (gy <= 1600) ? 0 : 979;
            gy -= (gy <= 1600) ? 621 : 1600;
            let gy2 = (gm > 2) ? (gy + 1) : gy;
            let days = (365 * gy) + parseInt((gy2 + 3) / 4) - parseInt((gy2 + 99) / 100) + parseInt((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
            jy += 33 * parseInt(days / 12053);
            days %= 12053;
            jy += 4 * parseInt(days / 1461);
            days %= 1461;
            jy += parseInt((days - 1) / 365);
            if (days > 0) days = (days - 1) % 365;
            let jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
            let jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
            return [jy, jm, jd];
        }

        const PERSIAN_MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
        const WEEK_DAYS = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنج‌شنبه", "جمعه", "شنبه"];

        function toPersianDigits(num) {
            return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        let currentActiveDayIndex = 0;
        let daysData = [];
        let globalTasksState = {};

        function initDays() {
            daysData = [];
            const now = new Date();
            
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(now);
                dateObj.setDate(now.getDate() + i);
                
                const [jy, jm, jd] = toJalali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
                const dayName = WEEK_DAYS[dateObj.getDay()];
                const dateKey = `${jy}-${String(jm).padStart(2, '0')}-${String(jd).padStart(2, '0')}`;

                daysData.push({
                    index: i,
                    dayName: dayName,
                    dayNum: jd,
                    monthName: PERSIAN_MONTHS[jm - 1],
                    year: jy,
                    dateKey: dateKey,
                    isToday: i === 0
                });
            }
        }

        // Cloud Storage Actions
        async function fetchRemoteTasks() {
            if (BIN_ID === "YOUR_BIN_ID") {
                const local = localStorage.getItem('farsi_tasks');
                globalTasksState = local ? JSON.parse(local) : {};
                renderTasks();
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                if (res.ok) {
                    const data = await res.json();
                    globalTasksState = data.record || {};
                    localStorage.setItem('farsi_tasks', JSON.stringify(globalTasksState));
                    updateSyncBadge(true);
                    renderTasks();
                }
            } catch (err) {
                updateSyncBadge(false);
            }
        }

        async function saveRemoteTasks() {
            localStorage.setItem('farsi_tasks', JSON.stringify(globalTasksState));
            if (BIN_ID === "YOUR_BIN_ID") return;

            try {
                updateSyncBadge(null, "در حال ذخیره...");
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(globalTasksState)
                });
                updateSyncBadge(true);
            } catch (err) {
                updateSyncBadge(false);
            }
        }

        function updateSyncBadge(isSuccess, customText) {
            const badge = document.getElementById('sync-status');
            const text = document.getElementById('sync-text');

            if (customText) {
                text.innerText = customText;
                return;
            }

            if (isSuccess) {
                badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-950/60 text-emerald-400 border border-emerald-500/40 shadow-[0_0_8px_rgba(16,185,129,0.2)]";
                text.innerText = "همگام‌سازی آنلاین";
            } else {
                badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-amber-950/60 text-amber-400 border border-amber-500/40 shadow-[0_0_8px_rgba(245,158,11,0.2)]";
                text.innerText = "ذخیره محلی (آفلاین)";
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';

            daysData.forEach((day, index) => {
                const isActive = index === currentActiveDayIndex;
                const tab = document.createElement('button');
                tab.onclick = () => switchTab(index);
                
                tab.className = `flex-1 min-w-[105px] p-3 rounded-2xl text-center transition-all duration-300 border flex flex-col items-center justify-center shrink-0 ${
                    isActive 
                    ? 'bg-gradient-to-b from-cyan-950 to-slate-900 text-cyan-300 border-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.35)] scale-[1.02]' 
                    : 'bg-slate-900/60 text-slate-400 border-slate-800 hover:border-slate-700 hover:bg-slate-800/50 hover:text-slate-200'
                }`;

                tab.innerHTML = `
                    <span class="text-xs font-medium ${isActive ? 'text-cyan-400' : 'text-slate-500'}">${day.isToday ? 'امروز' : day.dayName}</span>
                    <span class="text-base font-bold my-0.5 ${isActive ? 'text-white' : ''}">${toPersianDigits(day.dayNum)} ${day.monthName}</span>
                    <span class="text-[10px] ${isActive ? 'text-cyan-400/80' : 'text-slate-500'}">${day.dayName}</span>
                `;
                container.appendChild(tab);
            });
        }

        function switchTab(index) {
            currentActiveDayIndex = index;
            renderTabs();
            renderTasks();
        }

        function renderTasks() {
            const currentDay = daysData[currentActiveDayIndex];
            document.getElementById('selected-day-title').children[0].innerText = `${currentDay.dayName} ${toPersianDigits(currentDay.dayNum)} ${currentDay.monthName}`;
            
            const todayBadge = document.getElementById('today-badge');
            if (currentDay.isToday) todayBadge.classList.remove('hidden');
            else todayBadge.classList.add('hidden');

            document.getElementById('selected-day-sub').innerText = `برنامه‌ریزی روز ${currentDay.dayName}`;

            const dayTasks = globalTasksState[currentDay.dateKey] || [];
            document.getElementById('task-counter').innerText = `${toPersianDigits(dayTasks.length)} وظیفه`;

            const listContainer = document.getElementById('task-list');
            listContainer.innerHTML = '';

            if (dayTasks.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-slate-600">
                        <svg class="w-12 h-12 mb-2 stroke-1 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p class="text-sm font-light text-slate-500">هیچ وظیفه‌ای برای این روز ثبت نشده است</p>
                    </div>
                `;
                return;
            }

            dayTasks.forEach((task, tIndex) => {
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-3.5 rounded-xl border bg-slate-950/70 hover:border-cyan-500/50 transition-all duration-200 animate-fade-in ${
                    task.completed 
                    ? 'border-slate-800/80 opacity-50 bg-slate-950/30' 
                    : 'border-slate-800 hover:shadow-[0_0_12px_rgba(6,182,212,0.15)]'
                }`;
                
                item.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse min-w-0 flex-1 ml-2">
                        <button onclick="toggleTask(${tIndex})" class="w-5 h-5 rounded-md border ${
                            task.completed 
                            ? 'bg-fuchsia-600 border-fuchsia-500 text-white shadow-[0_0_8px_rgba(217,70,239,0.5)]' 
                            : 'border-slate-600 hover:border-cyan-400'
                        } flex items-center justify-center transition-colors">
                            ${task.completed ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </button>
                        <span class="text-sm font-medium ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'} truncate">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${tIndex})" class="text-slate-600 hover:text-pink-500 p-1.5 rounded-lg hover:bg-pink-950/30 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                `;
                listContainer.appendChild(item);
            });
        }

        // Action Handlers
        document.getElementById('add-task-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (!text) return;

            const currentDay = daysData[currentActiveDayIndex];
            if (!globalTasksState[currentDay.dateKey]) {
                globalTasksState[currentDay.dateKey] = [];
            }

            globalTasksState[currentDay.dateKey].push({
                text: text,
                completed: false,
                createdAt: Date.now()
            });

            input.value = '';
            renderTasks();
            await saveRemoteTasks();
        };

        window.toggleTask = async (index) => {
            const currentDay = daysData[currentActiveDayIndex];
            if (globalTasksState[currentDay.dateKey] && globalTasksState[currentDay.dateKey][index]) {
                globalTasksState[currentDay.dateKey][index].completed = !globalTasksState[currentDay.dateKey][index].completed;
                renderTasks();
                await saveRemoteTasks();
            }
        };

        window.deleteTask = async (index) => {
            const currentDay = daysData[currentActiveDayIndex];
            if (globalTasksState[currentDay.dateKey]) {
                globalTasksState[currentDay.dateKey].splice(index, 1);
                renderTasks();
                await saveRemoteTasks();
            }
        };

        // Auto Refresh sync every 5 seconds across devices
        setInterval(fetchRemoteTasks, 5000);

        // App Launch
        initDays();
        document.getElementById('current-jalali-month').innerText = `تقویم - سال ${toPersianDigits(daysData[0].year)}`;
        renderTabs();
        fetchRemoteTasks();
    </script>
</body>
</html>
